apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-infragilis-tls" .Values.tenant.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-platform.labels" . | nindent 4 }}
spec:
  secretName: {{ printf "%s-infragilis-tls" .Values.tenant.name }}
  dnsNames:
    - {{ .Values.tenant.hostname | quote }}
  issuerRef:
    name: {{ .Values.tls.issuerName }}
    kind: ClusterIssuer
    group: cert-manager.io
