apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-platform.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-redirect-to-https@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.tenant.hostname | quote }}
      secretName: {{ printf "%s-infragilis-tls" .Values.tenant.name }}
  rules:
    - host: {{ .Values.tenant.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: {{ .Values.service.port }}
